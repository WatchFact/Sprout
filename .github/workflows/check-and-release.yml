name: Check and release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory: ['.', 'music']
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        run: npm install --global pnpm@11.25.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm exec tsc --noEmit
      - name: Regression tests
        run: for test in tests/*.cjs; do node "$test" || exit 1; done
      - name: Production build
        run: pnpm build
  release:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish source release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="source-$(date -u +%Y%m%d)-${GITHUB_SHA:0:7}"
          gh release create "$tag" --target "$GITHUB_SHA" --title "Sprout source ${GITHUB_SHA:0:7}" --notes "Video, Music, and Studio source snapshot. Both applications passed type checks, regression tests, and production builds. Download the source archives below; runtime data and secrets are not included."
